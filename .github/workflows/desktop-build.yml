name: Build INCANDESCENT Windows app and installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/windows-installer-model-setup
    paths:
      - "desktop_app.py"
      - "model_setup.py"
      - "server.py"
      - "run_incandescent.py"
      - "index.html"
      - "incandescent.ico"
      - "requirements-desktop.txt"
      - "build_desktop.bat"
      - "DESKTOP-APP.md"
      - "README.txt"
      - "installer/**"
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/regression.yml"
      - "test_model_setup.py"
  pull_request:
    paths:
      - "desktop_app.py"
      - "model_setup.py"
      - "server.py"
      - "run_incandescent.py"
      - "index.html"
      - "incandescent.ico"
      - "requirements-desktop.txt"
      - "build_desktop.bat"
      - "DESKTOP-APP.md"
      - "README.txt"
      - "installer/**"
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/regression.yml"
      - "test_model_setup.py"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-desktop.txt

      - name: Validate Python source and model setup helpers
        run: |
          python -m py_compile desktop_app.py model_setup.py server.py run_incandescent.py
          python test_model_setup.py

      - name: Build one-file Windows executable
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name INCANDESCENT
          --icon incandescent.ico
          --add-data "index.html;."
          --add-data "incandescent.ico;."
          --hidden-import server
          --hidden-import run_incandescent
          --hidden-import model_setup
          desktop_app.py

      - name: Verify bundled renderer files
        shell: pwsh
        run: |
          $exe = "dist/INCANDESCENT.exe"
          if (!(Test-Path $exe)) { throw "Build did not create $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 30000000) { throw "EXE looks too small to contain the renderer: $($item.Length) bytes." }
          $archive = & pyi-archive_viewer -l -r $exe 2>&1 | Out-String
          $archive | Set-Content -Encoding UTF8 dist/archive-list.txt
          foreach ($name in @("QtWebEngineProcess.exe", "qtwebengine_resources.pak", "server", "run_incandescent", "model_setup", "msvcp140.dll", "vcruntime140.dll")) {
            if ($archive -notmatch [regex]::Escape($name)) {
              throw "Expected bundled runtime/module was not found in the EXE archive: $name"
            }
          }
          Write-Host "Built $($item.Name): $($item.Length) bytes"
          Remove-Item dist/archive-list.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows setup installer
        shell: pwsh
        run: |
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $paths = @(
            (Join-Path $programFilesX86 "Inno Setup 7\ISCC.exe"),
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (!$iscc) { throw "Could not locate Inno Setup Compiler (ISCC.exe)." }
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          & $iscc "installer/INCANDESCENT.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $setup = "dist/installer/INCANDESCENT-Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer was not created at $setup." }
          $item = Get-Item $setup
          if ($item.Length -lt 30000000) { throw "Installer is unexpectedly small ($($item.Length) bytes)." }
          Write-Host "Built $($item.Name): $($item.Length) bytes"

      - name: Add quick-start note
        shell: pwsh
        run: |
          @'
          INCANDESCENT WINDOWS INSTALLER
          =============================
          1. Run INCANDESCENT-Setup.exe.
          2. Keep Ollama installed and running. This installer does not install Ollama.
          3. The setup checks for qwen3.5:2b and downloads it if it is missing.
          4. Model download is approximately 2.7–3.1 GB and requires internet access.
          5. If you skip model setup, open "Prepare INCANDESCENT Model" from Start Menu later.
          6. The application and model setup work without a separate WebView2 install.
          7. If startup fails, check %LOCALAPPDATA%\INCANDESCENT\desktop.log.

          The first release targets 64-bit Windows 10 and later. Windows ARM64 uses x64 emulation.
          Windows 7/8/8.1 and 32-bit Windows are not supported by this installer.
          '@ | Set-Content -Encoding UTF8 dist/QUICK-START.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: INCANDESCENT-Windows-x64-Installer
          path: |
            dist/installer/INCANDESCENT-Setup.exe
            dist/INCANDESCENT.exe
            dist/QUICK-START.txt
          if-no-files-found: error
          retention-days: 14
