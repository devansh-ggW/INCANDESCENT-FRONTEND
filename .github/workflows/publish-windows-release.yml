name: Publish INCANDESCENT Windows release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-windows-release.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the known-good Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/incandescent-release"
          gh run download 39874679563 \
            --repo "$GITHUB_REPOSITORY" \
            --name "INCANDESCENT-Windows-x64-Installer" \
            --dir "$RUNNER_TEMP/incandescent-release"

          app="$RUNNER_TEMP/incandescent-release/INCANDESCENT.exe"
          setup="$RUNNER_TEMP/incandescent-release/installer/INCANDESCENT-Setup.exe"
          note="$RUNNER_TEMP/incandescent-release/QUICK-START.txt"

          test -s "$app"
          test -s "$setup"
          test -s "$note"
          test "$(stat -c '%s' "$app")" -gt 100000000
          test "$(stat -c '%s' "$setup")" -gt 100000000
          if head -c 64 "$app" | grep -q "version https://git-lfs.github.com/spec/v1"; then
            echo "Build artifact unexpectedly contains an LFS pointer, not an executable."
            exit 1
          fi
          file "$app" "$setup"

      - name: Publish actual binaries as Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/incandescent-release"
          app="$dir/INCANDESCENT.exe"
          setup="$dir/installer/INCANDESCENT-Setup.exe"
          note="$dir/QUICK-START.txt"

          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 "$setup" "$app" "$note" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.0 "$setup" "$app" "$note" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "INCANDESCENT Windows 1.0.0" \
              --notes "First Windows installer release. Download INCANDESCENT-Setup.exe to install. Requires an existing Ollama installation; model setup downloads qwen3.5:2b if needed."
          fi

          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY"
