name: Replace repository with installer bundle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/replace-repo-with-installer.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  replace-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the existing installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/incandescent-bundle"
          gh run download 39874679563 \
            --repo "$GITHUB_REPOSITORY" \
            --name "INCANDESCENT-Windows-x64-Installer" \
            --dir "$RUNNER_TEMP/incandescent-bundle"
          echo "Downloaded files:"
          find "$RUNNER_TEMP/incandescent-bundle" -type f -printf '%P (%s bytes)\n' | sort
          test -n "$(find "$RUNNER_TEMP/incandescent-bundle" -type f -print -quit)"
          find "$RUNNER_TEMP/incandescent-bundle" -type f -iname 'INCANDESCENT-Setup.exe' -print -quit | grep -q .
          find "$RUNNER_TEMP/incandescent-bundle" -type f -iname 'INCANDESCENT.exe' -print -quit | grep -q .
          find "$RUNNER_TEMP/incandescent-bundle" -type f -iname 'QUICK-START.txt' -print -quit | grep -q .

      - name: Replace tracked repository contents with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/incandescent-bundle"

          # Check size before changing the working tree.
          use_lfs=0
          while IFS= read -r -d '' file; do
            size=$(stat -c '%s' "$file")
            if [ "$size" -gt 95000000 ]; then
              use_lfs=1
            fi
          done < <(find "$package" -type f -print0)

          # Remove all current tracked project files and any untracked debris.
          git rm -rf --ignore-unmatch .
          git clean -fdx

          # Restore only the downloaded artifact's files and their folder structure.
          cp -a "$package"/. "$GITHUB_WORKSPACE"/

          # Large executables must be stored in LFS to pass GitHub's 100 MiB limit.
          # Create .gitattributes after clean/copy so it survives and is committed.
          if [ "$use_lfs" -eq 1 ]; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
            git lfs install
            git lfs track "*.exe"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          echo "Files to publish:"
          git diff --cached --name-status
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "Replacement tree is identical; nothing to publish."
            exit 0
          fi

          git commit -m "Replace repository contents with Windows installer bundle"
          git push origin HEAD:main
